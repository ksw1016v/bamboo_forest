name: daily-post

on:
  schedule:
    # 목표 19:00 KST (=10:00 UTC). 예약 실행이 늦거나 빠질 수 있어 여러 번 시도, guard.py가 하루 1편만 허용
    - cron: "47 9 * * *"
    - cron: "7 10 * * *"
    - cron: "23 10 * * *"
    - cron: "47 10 * * *"
    - cron: "17 11 * * *"
    - cron: "47 11 * * *"
  push:
    paths:
      - ".github/post-now"   # 이 파일에 게시물 번호를 적어 푸시하면 바로 게시
  workflow_dispatch:
    inputs:
      slug:
        description: "올릴 게시물 번호 (비우면 대기열의 다음 편)"
        required: false
      force:
        description: "오늘 이미 올렸어도 올리기"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: instagram-post

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 오늘 이미 올렸는지 확인
        id: guard
        env:
          FORCE: ${{ inputs.force }}
        run: python3 guard.py >> "$GITHUB_OUTPUT"

      - name: 게시할 편 고르기
        if: steps.guard.outputs.skip != '1'
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then echo "slug=$(cat .github/post-now | tr -s ' \n' ' ' | sed 's/ *$//')" >> "$GITHUB_OUTPUT";
          elif [ -n "${{ inputs.slug }}" ]; then echo "slug=$(printf '%03d' ${{ inputs.slug }})" >> "$GITHUB_OUTPUT";
          else echo "slug=$(python3 publish.py next)" >> "$GITHUB_OUTPUT"; fi

      - name: 대기열 비어 있음
        if: steps.guard.outputs.skip != '1' && steps.pick.outputs.slug == ''
        run: echo "::warning::게시할 편이 없어요. posts 폴더에 새 게시물을 추가해 주세요."

      - name: 미디어 공개 주소 준비 (jsDelivr가 늦으면 GitHub 원본 주소)
        if: steps.pick.outputs.slug != ''
        run: |
          check() { for f in $(ls posts/$SLUG | grep -v post.json); do ok=0; for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$1/posts/$SLUG/$f"); [ "$code" = "200" ] && { ok=1; break; }; sleep 5; done
            echo "$f -> $code"; [ "$ok" = "1" ] || return 1; done; }
          J="https://cdn.jsdelivr.net/gh/${{ github.repository }}@${{ github.sha }}"
          R="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}"
          okall() { for SLUG in ${{ steps.pick.outputs.slug }}; do check "$1" || return 1; done; }
          if okall "$J"; then echo "MEDIA_BASE=$J" >> "$GITHUB_ENV"
          elif okall "$R"; then echo "::warning::jsDelivr 대신 GitHub 원본 주소 사용"; echo "MEDIA_BASE=$R" >> "$GITHUB_ENV"
          else echo "::error::미디어 공개 주소 준비 실패"; exit 1; fi

      - name: 인스타그램 게시
        if: steps.pick.outputs.slug != ''
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          for s in ${{ steps.pick.outputs.slug }}; do python3 publish.py post $s; done
          git config user.name "bamboo-forest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git commit -m "published ${{ steps.pick.outputs.slug }}"
          git pull --rebase
          git push
